name: M18 Acceptance

on:
  push:
    branches:
      - codex/m16-family-transformations
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "content/**"
      - "schemas/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/m17-ci.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:engine
      - run: npm run test:content
      - run: npm run content:validate
      - run: npm run test:replay
      - run: npm run test:properties
      - name: Focused M03-M18 tests
        run: |
          npm run test:m03
          npm run test:m04
          npm run test:m05
          npm run test:m06
          npm run test:m07
          npm run test:m08
          npm run test:m09
          npm run test:m10
          npm run test:m11
          npm run test:m12
          npm run test:m13
          npm run test:m14
          npm run test:m15
          npm run test:m16
          npm run test:m17
          npm run test:m18
      - run: npm run build
      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
